name: horizon

services:
  horizon:
    image: horizon:local
    build:
      context: .
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    init: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Scheduling is owned by systemd. The container itself is a one-shot job.
    command: ["--hours", "24"]
